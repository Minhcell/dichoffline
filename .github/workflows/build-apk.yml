name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
        echo "$(dirname "$SM")" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        yes | "$SM" --licenses > /dev/null || true
        "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Validate Gradle wrapper
      run: |
        echo "--- gradlew info ---"
        file gradlew
        ls -la gradle/wrapper/gradle-wrapper.jar
        echo "--- check jar ---"
        file gradle/wrapper/gradle-wrapper.jar

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DichThuatPro-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/*.apk
        generate_release_notes: true
